name: CI

on:
  pull_request:
    branches: [main]
  # Also allow manual trigger for debugging
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # INFRA-102: keep Playwright's screenshots and error-context.md so a CI-only
      # failure (e.g. a timeout that does not reproduce locally) shows the step
      # and page state it stopped on.
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # INFRA-108: the base branch's history, to compare the PR against it;
          # trees only (the art makes the full pack ~145 MB), blobs on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Verify critical files exist
        run: |
          files=(
            "pwa/index.html"
            "pwa/sw.js"
            "pwa/manifest.json"
            "pwa/assets/style.css"
            "pwa/js/engine.js"
            "pwa/js/app.js"
            "pwa/js/storage.js"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # INFRA-108: since INFRA-107 the service worker never refreshes a
      # version's cached HTML and code, so a change to the deployed pwa/ only
      # reaches installed apps with a new CACHE name (`npm run bump`). Fails a
      # PR that changes pwa/ without one.
      - name: Check that a pwa/ change bumps the version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"
