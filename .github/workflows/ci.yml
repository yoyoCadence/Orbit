name: CI

on:
  pull_request:
    branches: [main]
  # Also allow manual trigger for debugging
  workflow_dispatch:

# INFRA-112: the jobs only read the repository (artifacts use the runner's own
# token), so the workflow token gets nothing more.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # INFRA-116 (approved 2026-11-19): the database tests, each in a fresh
  # database of a throwaway PostgreSQL 16 (stand-in → pwa/db/0*.sql → test, see
  # tests/database/README.md). The official image already has the PGDG apt
  # repository, so pgTAP installs inside it; run.sh runs there too, over the
  # local socket. No secret, nothing outside this job's container.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The repository is mounted into the container; keep the token out of .git/config.
          persist-credentials: false

      - name: Start PostgreSQL 16 with pgTAP
        run: |
          docker run -d --name orbit-db -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$GITHUB_WORKSPACE:/repo:ro" postgres:16
          # The image's first start runs a temporary server on the socket only,
          # then restarts: TCP answers only once the final server is up.
          for i in $(seq 1 60); do
            docker exec orbit-db pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 1
          done
          docker exec orbit-db pg_isready -h 127.0.0.1 -U postgres || { docker logs orbit-db; exit 1; }
          for attempt in 1 2 3; do
            docker exec -e DEBIAN_FRONTEND=noninteractive orbit-db bash -c \
              'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-pgtap >/dev/null' && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      - name: Run database tests
        run: docker exec -u postgres -e REQUIRE_PGTAP=1 orbit-db /repo/tests/database/run.sh

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # INFRA-102: keep Playwright's screenshots and error-context.md so a CI-only
      # failure (e.g. a timeout that does not reproduce locally) shows the step
      # and page state it stopped on.
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # INFRA-108: the base branch's history, to compare the PR against it;
          # trees only (the art makes the full pack ~145 MB), blobs on demand.
          fetch-depth: 0
          filter: blob:none

      - name: Verify critical files exist
        run: |
          files=(
            "pwa/index.html"
            "pwa/sw.js"
            "pwa/manifest.json"
            "pwa/assets/style.css"
            "pwa/js/engine.js"
            "pwa/js/app.js"
            "pwa/js/storage.js"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # INFRA-108: since INFRA-107 the service worker never refreshes a
      # version's cached HTML and code, so a change to the deployed pwa/ only
      # reaches installed apps with a new CACHE name (`npm run bump`). Fails a
      # PR that changes pwa/ without one.
      - name: Check that a pwa/ change bumps the version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"
